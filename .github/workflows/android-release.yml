name: Android release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create .env
        run: |
          cat > .env <<EOF
          BASE_URL=https://places.googleapis.com/v1/
          TEXT_SEARCH_URL=https://places.googleapis.com/v1/places:searchText
          NEARBY_SEARCH_URL=https://places.googleapis.com/v1/places:searchNearby
          API_KEY=${{ secrets.ANDROID_PLACES_API_KEY }}
          EOF
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Version name comes from the tag (v1.2.3 -> 1.2.3); the build number is the
      # workflow run number so it always increases and updates install over older versions.
      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="${{ github.run_number }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          generate_release_notes: true
